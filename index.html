<!DOCTYPE html>
<html lang="es"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Miraia</title>
<link rel="apple-touch-icon" href="icon.png">
<link rel="icon" href="icon.png">
<meta name="apple-mobile-web-app-title" content="Miraia">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<style>
:root{--bg:#f1ebe0;--card:#fbf8f2;--tx:#2b1d17;--mu:#7a6b60;--ac:#4a3228;--ac2:#e8dccb;--bd:#ddd2c1;--rd:#a63a2e;--rd2:#f3dcd6;--am:#8a5a00;--am2:#f3e3b8;color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1511;--card:#26201b;--tx:#f1e9dc;--mu:#a89a8a;--ac:#d9b99b;--ac2:#3a2d24;--bd:#3d332b;--rd:#e59a8f;--rd2:#43211c;--am:#e8c27a;--am2:#3a2e14;color-scheme:dark}}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .logo{filter:invert(1)}}
:root[data-theme="dark"] .logo{filter:invert(1)}
:root[data-theme="dark"]{--bg:#1b1511;--card:#26201b;--tx:#f1e9dc;--mu:#a89a8a;--ac:#d9b99b;--ac2:#3a2d24;--bd:#3d332b;--rd:#e59a8f;--rd2:#43211c;--am:#e8c27a;--am2:#3a2e14;color-scheme:dark}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--tx);font:16px/1.4 -apple-system,system-ui,"Segoe UI",Roboto,sans-serif;padding:14px 14px 90px}
h1{font-size:20px;margin:4px 0 12px}h2{font-size:15px;margin:18px 0 8px;color:var(--mu);font-weight:600}
.card{background:var(--card);border:1px solid var(--bd);border-radius:14px;padding:12px;margin-bottom:10px}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.k{font-size:12px;color:var(--mu)}.v{font-size:19px;font-weight:700}
.g{color:var(--ac)}.r{color:var(--rd)}
input,select{width:100%;font:inherit;padding:11px;border:1px solid var(--bd);border-radius:10px;background:var(--bg);color:var(--tx);margin-bottom:8px}
.row{display:flex;gap:8px}.row>*{flex:1}
button{font:inherit;border:0;border-radius:10px;padding:11px 14px;background:var(--ac);color:var(--bg);font-weight:600}
button.s{background:var(--ac2);color:var(--ac);padding:8px 10px;font-size:14px}
button.d{background:var(--rd2);color:var(--rd);padding:8px 10px;font-size:14px}
button.big{width:100%;padding:14px}
.it{display:flex;justify-content:space-between;gap:8px;align-items:flex-start;padding:10px 0;border-bottom:1px solid var(--bd)}
.it:last-child{border:0}.it b{display:block}.sm{font-size:13px;color:var(--mu)}
.chip{font-size:12px;padding:2px 8px;border-radius:99px;background:var(--ac2);color:var(--ac);white-space:nowrap}
.chip.p{background:var(--am2);color:var(--am)}
.acts{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
nav{position:fixed;left:0;right:0;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--bd);padding:6px 4px calc(6px + env(safe-area-inset-bottom,0px))}
nav button{flex:1;background:none;color:var(--mu);font-size:11px;padding:6px 2px;font-weight:500}
nav button.on{color:var(--ac);font-weight:700}
nav span{display:block;font-size:20px}
.hd{display:flex;align-items:center;gap:12px;margin:2px 0 14px}.hd img{height:34px;width:auto;max-width:100%}h1,.hd b{font-family:"Iowan Old Style",Palatino,Georgia,serif;font-weight:500;letter-spacing:.03em}.hd b{display:block;font-size:17px}.hd span{font-size:12px;color:var(--mu)}

.chs{display:flex;gap:8px;overflow-x:auto;padding-bottom:8px;margin-bottom:6px}.ch{flex-shrink:0;white-space:nowrap;background:var(--card);color:var(--tx);border:1px solid var(--bd);padding:7px 13px;border-radius:99px;font-size:14px;font-weight:500}.ch.on{background:var(--ac);color:var(--bg);border-color:var(--ac)}
.gw{border:1px solid var(--bd);border-radius:12px;overflow:auto;max-height:68vh;background:var(--card);-webkit-overflow-scrolling:touch}
table.gt{border-collapse:separate;border-spacing:0;width:max-content;min-width:100%;font-size:13px;font-variant-numeric:tabular-nums}
.gt th,.gt td{padding:9px 10px;border-bottom:1px solid var(--bd);border-right:1px solid var(--bd);white-space:nowrap;text-align:left}
.gt th{position:sticky;top:0;z-index:2;background:var(--ac2);color:var(--tx);font-weight:600}
.gt td:first-child,.gt th:first-child{position:sticky;left:0}
.gt td:first-child{z-index:1;background:var(--card)}.gt th:first-child{z-index:3}
.gt tbody tr:nth-child(even) td{background:var(--bg)}
.gt .n{text-align:right}.gt td.pn{white-space:normal;min-width:130px;max-width:170px;font-weight:600}
.gt .lo{background:var(--am2);color:var(--am);padding:2px 8px;border-radius:99px}
.gt tbody tr:active td{background:var(--ac2)}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:90px;background:var(--tx);color:var(--bg);padding:10px 16px;border-radius:99px;font-size:14px;display:none;z-index:9}
</style></head>
<body>
<div id="app"></div>
<div id="toast"></div>
<nav id="nav"></nav>
<script>
let S={p:[],s:[],c:[],k:[],b:0,cats:['Blusas','Vestidos','Pantalones']},T='res',E=null,D=null,F='all',tt;
try{const r=localStorage.getItem('miraia_v1');if(r)S=Object.assign(S,JSON.parse(r))}catch(e){}
const save=()=>{try{localStorage.setItem('miraia_v1',JSON.stringify(S))}catch(e){}};
const $=id=>document.getElementById(id);
const esc=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const f=n=>'$'+Math.round(n||0).toLocaleString('es-CO');
const dt=t=>t?new Date(t).toLocaleString('es-CO',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}):'';
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const num=id=>parseFloat($(id).value)||0;
function toast(m){const e=$('toast');e.textContent=m;e.style.display='block';clearTimeout(tt);tt=setTimeout(()=>e.style.display='none',2200)}

const Ev=x=>x.qty-(x.r||[]).reduce((a,r)=>a+r.qty,0);
const Va=x=>x.price*x.qty+(x.adj||[]).reduce((a,r)=>a+r.amt,0)-(x.r||[]).reduce((a,r)=>a+r.val,0);
const cfs=x=>x.cf||(x.pay?[{ts:x.payTs,m:x.pay,amt:x.price*x.qty}]:[]);
const mod=x=>{if(!x.cf)x.cf=cfs(x).map(c=>({...c}))};
let SEL=null,SM='';
function st(){let c=0,v=0,sold=0,real=0,pend=0,pn=0;
S.p.forEach(p=>{c+=p.cost*p.stock;v+=p.price*p.stock});
S.s.forEach(x=>{const t=Va(x),e=Ev(x);sold+=t;if(x.pay)real+=t-x.cost*e;else if(e>0){pend+=t;pn++}});
return{c,v,sold,real,pend,pn}}
function cash(){const l=S.k[S.k.length-1],since=l?l.ts:0,base=l?l.counted:S.b;
let cs=0,rf=0,ing=0,egr=0;
S.s.forEach(x=>cfs(x).forEach(c=>{if(c.m==='efectivo'&&c.ts>since){if(c.amt>=0)cs+=c.amt;else rf-=c.amt}}));
S.c.forEach(m=>{if(m.ts>since){if(m.type==='ingreso')ing+=m.amt;else egr+=m.amt}});
return{since,base,cs,rf,ing,egr,exp:base+cs-rf+ing-egr,first:!l}}

function vRes(){const s=st(),low=S.p.filter(p=>p.stock<=2);
return rem()+`<h1>Resumen</h1><div class="grid">
<div class="card"><div class="k">Inventario a costo</div><div class="v">${f(s.c)}</div></div>
<div class="card"><div class="k">Inventario a precio venta</div><div class="v">${f(s.v)}</div></div>
<div class="card"><div class="k">Ganancia potencial</div><div class="v g">${f(s.v-s.c)}</div></div>
<div class="card"><div class="k">Ganancia ya cobrada</div><div class="v g">${f(s.real)}</div></div>
<div class="card"><div class="k">Total vendido</div><div class="v">${f(s.sold)}</div></div>
<div class="card"><div class="k">Por cobrar (${s.pn})</div><div class="v r">${f(s.pend)}</div></div></div>
<h2>Por categoría</h2><div class="card">${S.cats.length?S.cats.map(c=>{const l=S.p.filter(p=>p.cat===c);return `<div class="it"><div><b>${esc(c)}</b><span class="sm">${l.reduce((a,p)=>a+p.stock,0)} und · a costo ${f(l.reduce((a,p)=>a+p.cost*p.stock,0))}</span></div></div>`}).join(''):'<span class="sm">Sin categorías</span>'}</div>
<h2>Poco stock (2 o menos)</h2><div class="card">${low.length?low.map(p=>`<div class="it"><b>${esc(pLabel(p))}</b><span class="chip p">${p.stock} und</span></div>`).join(''):'<span class="sm">Todo en orden</span>'}</div>`}

const pLabel=p=>[p.name,p.brand,p.model].filter(Boolean).join(' · ');
const SZ=['xxs','xs','s','m','l','xl','xxl','xxxl','única','unica','unitalla'],rk=v=>{const i=SZ.indexOf(String(v).toLowerCase());return i<0?100:i};
const uqv=(k,fl)=>[...new Set(S.p.filter(fl||(()=>true)).map(p=>p[k]).filter(Boolean))].sort(k==='brand'?(a,b)=>rk(a)-rk(b)||a.localeCompare(b,'es',{numeric:true}):(a,b)=>a.localeCompare(b,'es',{numeric:true}));
const opts=(l,cur,ph)=>`<option value="">${ph}</option>`+l.map(v=>`<option value="${esc(v)}" ${v===cur?'selected':''}>${esc(v)}</option>`).join('')+'<option value="__new">+ Nuevo…</option>';
const selNew=(id,ph,l,cur)=>`<select id="${id}" onchange="nw('${id}')">${opts(l,cur,ph)}</select><input id="${id}n" placeholder="Escribe el nuevo valor" style="display:none">`;
const gv=id=>{const v=$(id).value;return v==='__new'?$(id+'n').value.trim():v};
function nw(id){$(id+'n').style.display=$(id).value==='__new'?'block':'none';}
function mRefresh(){const cf=cfn($('pk').value),b=$('pb').value,l=b===''?uqv('model',cf):b==='__new'?[]:uqv('model',p=>cf(p)&&p.brand===b);$('pm').innerHTML=opts(l,'','Color…');$('pmn').style.display='none'}
const cfn=c=>c==='__new'?(()=>false):(p=>p.cat===c);
const chipsH=()=>`<button class="ch ${F==='all'?'on':''}" onclick="F='all';render()">Todas</button>`+S.cats.map((c,i)=>`<button class="ch ${F===c?'on':''}" onclick="F=S.cats[${i}];render()">${esc(c)}</button>`).join('');
const cdH=()=>F!=='all'&&!S.p.some(p=>p.cat===F)?`<div class="acts" style="margin:0 0 8px"><button class="d" onclick="cDel()">Eliminar categoría vacía «${esc(F)}»</button></div>`:'';
function fRefresh(){$('chs').innerHTML=chipsH();$('cdw').innerHTML=cdH();$('plist').innerHTML=pList()}
function catChg(){const c=$('pk').value;$('pnc').style.display=c==='__new'?'block':'none';const fl=cfn(c);
[['pn','name','Producto…'],['pb','brand','Talla…'],['pm','model','Color…']].forEach(([id,k,ph])=>{$(id).innerHTML=opts(uqv(k,fl),'',ph);$(id+'n').style.display='none'});
if(c!=='__new'){F=c;fRefresh()}}
let SK='name',SD=1;
function sortBy(k){if(SK===k)SD=-SD;else{SK=k;SD=1}$('plist').innerHTML=pList()}
function pList(){const q=(($('pq')||{}).value||'').toLowerCase().trim();
let l=S.p.filter(p=>(F==='all'||p.cat===F)&&(!q||(pLabel(p)+' '+(p.cat||'')).toLowerCase().includes(q)));
if(!l.length)return '<div class="sm" style="padding:14px">No hay productos aquí</div>';
const rkf=typeof rk==='function'?rk:()=>0,g=p=>SK==='gain'?p.price-p.cost:p[SK];
l.sort((a,b)=>{const x=g(a),y=g(b);let r;
if(SK==='brand')r=rkf(x||'')-rkf(y||'')||String(x||'').localeCompare(String(y||''),'es',{numeric:true});
else if(typeof x==='number')r=x-y;else r=String(x||'').localeCompare(String(y||''),'es',{numeric:true});
return (r||String(a.name).localeCompare(String(b.name),'es'))*SD});
const C=[['name','Producto'],...(F==='all'?[['cat','Categoría']]:[]),['brand','Talla'],['model','Color'],['stock','Stock','n'],['cost','Costo','n'],['price','Precio','n'],['gain','Ganancia','n']];
const th=C.map(c=>`<th class="${c[2]||''}" onclick="sortBy('${c[0]}')">${c[1]}${SK===c[0]?(SD>0?' ▲':' ▼'):''}</th>`).join('');
const cell=(p,k)=>k==='name'?`<td class="pn">${esc(p.name)}</td>`:k==='cat'?`<td>${esc(p.cat||'—')}</td>`:k==='stock'?`<td class="n"><b class="${p.stock<=2?'lo':''}">${p.stock}</b></td>`:(k==='cost'||k==='price')?`<td class="n">${f(p[k])}</td>`:k==='gain'?`<td class="n g">${f(p.price-p.cost)}</td>`:`<td>${esc(p[k]||'')}</td>`;
const rows=l.map(p=>`<tr onclick="E='${p.id}';D=null;render();scrollTo(0,0)">${C.map(c=>cell(p,c[0])).join('')}</tr>`).join('');
const u=l.reduce((a,p)=>a+p.stock,0),v=l.reduce((a,p)=>a+p.cost*p.stock,0);
return `<table class="gt"><thead><tr>${th}</tr></thead><tbody>${rows}</tbody></table><div class="sm" style="padding:9px 10px;position:sticky;left:0">${l.length} productos · ${u} unidades · valor a costo ${f(v)}</div>`}
function vInv(){const e=E&&S.p.find(p=>p.id===E)||{name:'',cat:F==='all'?'':F,brand:'',model:'',cost:'',price:'',stock:''};
const cc=e.cat||S.cats[0]||'__new',cf=cfn(cc);
return `<h1>Inventario</h1><div class="card"><b>${E?'Editar producto':'Nuevo producto'}</b><br><br>
<select id="pk" onchange="catChg()">${S.cats.map(c=>`<option value="${esc(c)}" ${cc===c?'selected':''}>${esc(c)}</option>`).join('')}<option value="__new" ${cc==='__new'?'selected':''}>+ Nueva categoría…</option></select>
<input id="pnc" placeholder="Nombre de la nueva categoría" style="display:${cc==='__new'?'block':'none'}">
${selNew('pn','Producto…',uqv('name',cf),e.name)}
<div class="row"><div style="min-width:0">${selNew('pb','Talla…',uqv('brand',cf),e.brand)}</div><div style="min-width:0">${selNew('pm','Color…',uqv('model',cf),e.model)}</div></div>
<div class="row"><input id="pc" type="number" inputmode="decimal" placeholder="Costo" value="${e.cost}"><input id="pp" type="number" inputmode="decimal" placeholder="Precio venta" value="${e.price}"></div>
<input id="ps" type="number" inputmode="numeric" placeholder="Cantidad en stock" value="${e.stock}">
<div class="row"><button onclick="pSave()">${E?'Actualizar':'Agregar'}</button>${E?'<button class="s" onclick="E=null;D=null;render()">Cancelar</button><button class="d" onclick="pDel(E)">'+(D===E?'¿Seguro?':'Borrar')+'</button>':''}</div></div>
<h2>Productos (${S.p.length}) · toca una fila para editar</h2>
<div class="chs" id="chs">${chipsH()}</div><div id="cdw">${cdH()}</div>
<input id="pq" placeholder="Buscar (ej. blusa, negro, M)" oninput="$('plist').innerHTML=pList()">
<div class="gw" id="plist">${pList()}</div>`}
function pSave(){const cn=(k,v)=>{const x=S.p.find(p=>p[k]&&p[k].toLowerCase()===v.toLowerCase());return x?x[k]:v};
const n0=gv('pn');if(!n0)return toast('Elige o escribe el producto');const n=cn('name',n0);
let cat=$('pk').value;
if(cat==='__new'){cat=$('pnc').value.trim();if(!cat)return toast('Escribe la categoría nueva');const ex=S.cats.find(c=>c.toLowerCase()===cat.toLowerCase());if(ex)cat=ex;else S.cats.push(cat)}
const o={name:n,cat,brand:cn('brand',gv('pb')),model:cn('model',gv('pm')),cost:num('pc'),price:num('pp'),stock:num('ps')};
let msg='Guardado';
if(E){Object.assign(S.p.find(p=>p.id===E),o);E=null}
else{const d=S.p.find(p=>p.cat===o.cat&&p.name===o.name&&p.brand===o.brand&&p.model===o.model);
if(d){d.stock+=o.stock;d.cost=o.cost;d.price=o.price;msg='Ya existía: se sumó al stock'}else S.p.push({id:uid(),...o})}
if(cat)F=cat;save();render();toast(msg)}
function cDel(){S.cats=S.cats.filter(c=>c!==F);F='all';save();render()}
function pDel(id){if(D===id){S.p=S.p.filter(p=>p.id!==id);D=null;E=null;save()}else D=id;render()}

function sRow(x){const e=Ev(x),V=Va(x),ad=(x.adj||[]).reduce((a,r)=>a+r.amt,0),rq=x.qty-e;
const chp=e===0?'<span class="chip">Devuelta</span>':`<span class="chip ${x.pay?'':'p'}">${x.pay?'Pagó '+x.pay:'Debe'}</span>`;
return `<div class="it" style="flex-wrap:wrap"><div style="flex:1;min-width:0"><b>${esc(x.name)} × ${e}${rq?' de '+x.qty:''}</b><span class="sm">${esc(x.client)} · ${dt(x.ts)}${ad?'<br>Ajustada +'+f(ad):''}${rq?'<br>Devueltas '+rq+' und':''}</span>
${e>0?`<div class="acts">${x.pay?'':`<button class="s" onclick="sPay('${x.id}','efectivo')">Cobró efectivo</button><button class="s" onclick="sPay('${x.id}','transferencia')">Cobró transf.</button>`}<button class="d" onclick="sOpen('${x.id}','ret')">Devolver</button><button class="s" onclick="sOpen('${x.id}','adj')">Ajustar valor</button></div>`:''}</div>
<div style="text-align:right"><b>${f(V)}</b>${chp}</div>${SEL===x.id?sPanel(x):''}</div>`}
function sPanel(x){const e=Ev(x),V=Va(x),pn='<div style="flex:0 0 100%;background:var(--bg);border-radius:10px;padding:10px">';
if(SM==='ret')return pn+`<b>Devolver producto</b><div class="sm" style="margin:2px 0 8px">Valor de la venta: ${f(V)} · ${e} und</div>
<input id="rq" type="number" inputmode="numeric" value="${e}" placeholder="Cantidad a devolver">
${x.pay?`<select id="rm"><option value="efectivo" ${x.pay==='efectivo'?'selected':''}>Devolví el dinero en efectivo</option><option value="transferencia" ${x.pay==='transferencia'?'selected':''}>Devolví el dinero por transferencia</option></select>`:'<div class="sm" style="margin-bottom:8px">No había pagado: se descuenta de lo que debe.</div>'}
<select id="ri"><option value="1">Vuelve al inventario</option><option value="0">No vuelve (dañado o perdido)</option></select>
<div class="row"><button class="big" onclick="sRet('${x.id}')">Registrar devolución</button><button class="s big" onclick="SEL=null;render()">Cancelar</button></div></div>`;
return pn+`<b>Ajustar valor</b><div class="sm" style="margin:2px 0 8px">Valor actual: ${f(V)}. Solo se puede subir, nunca bajar.</div>
<input id="av" type="number" inputmode="decimal" value="${Math.round(V)}" placeholder="Nuevo valor total">
${x.pay?`<div class="sm" style="margin-bottom:8px">La diferencia se registra como cobrada por ${x.pay}.</div>`:''}
<div class="row"><button class="big" onclick="sAdj('${x.id}')">Guardar ajuste</button><button class="s big" onclick="SEL=null;render()">Cancelar</button></div></div>`}
function sOpen(id,m){SEL=(SEL===id&&SM===m)?null:id;SM=m;render()}
function sRet(id){const x=S.s.find(x=>x.id===id),e=Ev(x),V=Va(x),q=num('rq');
if(q<=0||q>e)return toast('Cantidad inválida (máximo '+e+')');
const val=q===e?V:Math.round(V/e*q),m=x.pay?$('rm').value:'',inv=$('ri').value==='1',now=Date.now();
mod(x);x.r=x.r||[];x.r.push({ts:now,qty:q,val,amt:x.pay?val:0,m,inv});
if(x.pay)x.cf.push({ts:now,m,amt:-val});
let t='Devolución registrada';
if(inv){const p=S.p.find(p=>p.id===x.pid);if(p)p.stock+=q;else t='Devuelta; el producto ya no está en inventario'}
SEL=null;save();render();toast(t)}
function sAdj(id){const x=S.s.find(x=>x.id===id),V=Math.round(Va(x)),n=Math.round(num('av'));
if(n<V)return toast('No se puede bajar el valor');if(n===V)return toast('El valor no cambió');
const d=n-V,now=Date.now();mod(x);x.adj=x.adj||[];x.adj.push({ts:now,amt:d});
if(x.pay)x.cf.push({ts:now,m:x.pay,amt:d});
SEL=null;save();render();toast('Valor ajustado a '+f(n))}
function vVen(){const av=S.p.filter(p=>p.stock>0),pend=S.s.filter(x=>!x.pay&&Ev(x)>0).reverse(),done=S.s.filter(x=>x.pay||Ev(x)===0).reverse().slice(0,30);
return `<h1>Ventas</h1><div class="card">${av.length?`<input id="sf" placeholder="Buscar producto (ej. blusa negra M)" oninput="sFilter()"><select id="sp" onchange="selP(this.value)">${av.map(p=>`<option value="${p.id}">${esc(pLabel(p))} (${p.stock})</option>`).join('')}</select>
<div class="row"><input id="sq" type="number" inputmode="numeric" value="1" placeholder="Cant."><input id="sx" type="number" inputmode="decimal" value="${av[0].price}" placeholder="Precio"></div>
<input id="sc" placeholder="¿A quién se lo entregaste?">

function selP(v){const p=S.p.find(p=>p.id===v);$('sx').value=p?p.price:''}
function sFilter(){const q=$('sf').value.toLowerCase().trim(),l=S.p.filter(p=>p.stock>0&&(pLabel(p)+' '+(p.cat||'')).toLowerCase().includes(q));
$('sp').innerHTML=l.map(p=>`<option value="${p.id}">${esc(pLabel(p))} (${p.stock})</option>`).join('')||'<option value="">Sin resultados</option>';selP(l[0]?l[0].id:'')}
function sell(){const p=S.p.find(p=>p.id===$('sp').value);if(!p)return toast('Elige un producto');
const q=num('sq'),pr=num('sx');if(q<=0)return toast('Cantidad inválida');if(q>p.stock)return toast('Solo quedan '+p.stock);
const pay=$('sy').value||null,now=Date.now();
S.s.push({id:uid(),ts:now,pid:p.id,name:pLabel(p),qty:q,cost:p.cost,price:pr,client:$('sc').value.trim()||'Sin nombre',pay,payTs:pay?now:0,cf:pay?[{ts:now,m:pay,amt:pr*q}]:[]});
p.stock-=q;save();render();toast('Venta registrada')}
function sPay(id,m){const x=S.s.find(x=>x.id===id);mod(x);const now=Date.now();x.pay=m;x.payTs=now;x.cf.push({ts:now,m,amt:Va(x)});save();render();toast('Cobro registrado')}

function rPick(inp){const fl=inp.files[0];inp.value='';if(!fl)return;const r=new FileReader();
r.onload=()=>{try{const o=JSON.parse(r.result);if(!o||!Array.isArray(o.p)||!Array.isArray(o.s))throw 0;if(o.app&&o.app!=='miraia-tienda'){toast('Ese respaldo es de otra tienda');return}
PR={p:o.p,s:o.s,cats:Array.isArray(o.cats)?o.cats:['Blusas','Vestidos','Pantalones'],c:Array.isArray(o.c)?o.c:[],k:Array.isArray(o.k)?o.k:[],b:+o.b||0,lb:+o.lb||0};render();scrollTo(0,0)}catch(e){toast('Ese archivo no es un respaldo válido')}};r.readAsText(fl)}
function rOk(){S=PR;PR=null;save();render();toast('Datos restaurados')}

const CT=(()=>{const t=[];for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xEDB88320^(c>>>1):c>>>1;t[n]=c>>>0}return t})();
const crc=b=>{let c=-1;for(let i=0;i<b.length;i++)c=CT[(c^b[i])&255]^(c>>>8);return (c^-1)>>>0};
function zip(files){const en=new TextEncoder(),parts=[],cd=[];let off=0;
for(const [name,txt] of files){const nb=en.encode(name),d=en.encode(txt),c=crc(d);
const h=new DataView(new ArrayBuffer(30));h.setUint32(0,0x04034b50,true);h.setUint16(4,20,true);h.setUint16(6,0x0800,true);h.setUint16(12,33,true);h.setUint32(14,c,true);h.setUint32(18,d.length,true);h.setUint32(22,d.length,true);h.setUint16(26,nb.length,true);
parts.push(new Uint8Array(h.buffer),nb,d);
const e=new DataView(new ArrayBuffer(46));e.setUint32(0,0x02014b50,true);e.setUint16(4,20,true);e.setUint16(6,20,true);e.setUint16(8,0x0800,true);e.setUint16(14,33,true);e.setUint32(16,c,true);e.setUint32(20,d.length,true);e.setUint32(24,d.length,true);e.setUint16(28,nb.length,true);e.setUint32(42,off,true);
cd.push(new Uint8Array(e.buffer),nb);off+=30+nb.length+d.length}
let cs=0;cd.forEach(x=>cs+=x.length);
const z=new DataView(new ArrayBuffer(22));z.setUint32(0,0x06054b50,true);z.setUint16(8,files.length,true);z.setUint16(10,files.length,true);z.setUint32(12,cs,true);z.setUint32(16,off,true);
return new Blob([...parts,...cd,new Uint8Array(z.buffer)],{type:'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet'})}
const ex=s=>String(s).replace(/[\x00-\x08\x0B\x0C\x0E-\x1F]/g,'').replace(/[&<>]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;'}[c]));
const colL=i=>String.fromCharCode(65+i);
function sheetXml(rows,w){return '<?xml version="1.0" encoding="UTF-8"?><worksheet xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main"><cols>'+w.map((x,i)=>`<col min="${i+1}" max="${i+1}" width="${x}" customWidth="1"/>`).join('')+'</cols><sheetData>'+rows.map((r,y)=>`<row r="${y+1}">`+r.map((v,x)=>{const ref=colL(x)+(y+1);return typeof v==='number'&&isFinite(v)?`<c r="${ref}"><v>${v}</v></c>`:`<c r="${ref}" t="inlineStr"><is><t>${ex(v)}</t></is></c>`}).join('')+'</row>').join('')+'</sheetData></worksheet>'}
function makeXlsx(sheets){const H='<?xml version="1.0" encoding="UTF-8"?>',R='http://schemas.openxmlformats.org/officeDocument/2006/relationships',P='http://schemas.openxmlformats.org/package/2006/relationships';
const f=[['[Content_Types].xml',H+'<Types xmlns="http://schemas.openxmlformats.org/package/2006/content-types"><Default Extension="rels" ContentType="application/vnd.openxmlformats-package.relationships+xml"/><Default Extension="xml" ContentType="application/xml"/><Override PartName="/xl/workbook.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.sheet.main+xml"/>'+sheets.map((s,i)=>`<Override PartName="/xl/worksheets/sheet${i+1}.xml" ContentType="application/vnd.openxmlformats-officedocument.spreadsheetml.worksheet+xml"/>`).join('')+'</Types>'],
['_rels/.rels',H+`<Relationships xmlns="${P}"><Relationship Id="rId1" Type="${R}/officeDocument" Target="xl/workbook.xml"/></Relationships>`],
['xl/workbook.xml',H+`<workbook xmlns="http://schemas.openxmlformats.org/spreadsheetml/2006/main" xmlns:r="${R}"><sheets>`+sheets.map((s,i)=>`<sheet name="${ex(s[0])}" sheetId="${i+1}" r:id="rId${i+1}"/>`).join('')+'</sheets></workbook>'],
['xl/_rels/workbook.xml.rels',H+`<Relationships xmlns="${P}">`+sheets.map((s,i)=>`<Relationship Id="rId${i+1}" Type="${R}/worksheet" Target="worksheets/sheet${i+1}.xml"/>`).join('')+'</Relationships>']];
sheets.forEach((s,i)=>f.push([`xl/worksheets/sheet${i+1}.xml`,sheetXml(s[1],s[2])]));
return zip(f)}
async function saveFile(blob,name){const file=new File([blob],name,{type:blob.type});
if(navigator.canShare&&navigator.canShare({files:[file]})){try{await navigator.share({files:[file],title:name});return true}catch(e){if(e&&e.name==='AbortError')return false}}
const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download=name;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),5000);return true}
